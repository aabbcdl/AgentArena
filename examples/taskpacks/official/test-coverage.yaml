schemaVersion: agentarena.taskpack/v1
id: test-coverage
title: Add Focused Validator and Logger Tests
description: Add meaningful tests for two previously uncovered modules and prove they catch a mutation.
metadata:
  source: official
  owner: AgentArena
  lifecycle: core
  difficulty: medium
  objective: Expand behavioral coverage with non-trivial assertions and a deterministic mutation gate.
  repoTypes: [node]
  tags: [core, benchmark, tests, coverage]
  dependencies: []
  judgeRationale: Both test files must run and the mutation gate must observe a real failing assertion after a controlled source mutation.
  differentiator: Rejects placeholder tests that merely execute code without detecting a regression.
  i18n:
    zh-CN:
      title: 增加校验和日志测试
      description: 为两个未覆盖模块增加有意义的测试，并证明测试能抓住变异。
      objective: 用非平凡断言扩展行为覆盖，并通过确定性 mutation gate。
      judgeRationale: 两个测试文件必须运行，mutation gate 必须观察到受控源码变异后的失败。
repoSource: builtin://nodejs-core
prompt: |
  Add focused tests for the currently uncovered `src/logger.js` and
  `src/validator.js` modules:

  - create `test/logger.test.js` covering level filtering, inherited context,
    and child logger output;
  - create `test/validator.test.js` covering script/markup removal, safe paths,
    traversal rejection, and empty-name errors.

  Use real assertions and keep production code unchanged. The tests must catch
  the validator mutation exercised by `scripts/check-coverage-gate.mjs`.
expectedChangedPaths: [test/logger.test.js, test/validator.test.js]
changePolicy:
  requireAgentChange: true
  allowedPaths: [test/logger.test.js, test/validator.test.js]
  forbiddenPaths: ["src/**", "scripts/**", package.json, "fixtures/**"]
  minChangedFiles: 2
  maxChangedFiles: 2
envAllowList: []
setupCommands:
  - id: inject-fault
    label: Prepare the uncovered-module baseline
    command: node scripts/inject-task-fault.mjs test-coverage
    timeoutMs: 10000
judges:
  - id: behavior
    type: command
    label: Coverage task files and baseline behavior are valid
    command: node scripts/verify-core-task.mjs test-coverage
    timeoutMs: 10000
    critical: true
  - id: logger-tests
    type: command
    label: New logger tests pass
    command: node --test test/logger.test.js
    timeoutMs: 30000
    critical: true
  - id: validator-tests
    type: command
    label: New validator tests pass
    command: node --test test/validator.test.js
    timeoutMs: 30000
    critical: true
  - id: mutation-gate
    type: command
    label: Tests detect a controlled validator mutation
    command: node scripts/check-coverage-gate.mjs
    timeoutMs: 30000
    critical: true
