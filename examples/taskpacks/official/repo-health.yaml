schemaVersion: agentarena.taskpack/v1
id: repo-health
title: Repair Word Capitalization
description: Restore word-level capitalization without disturbing neighboring helpers.
metadata:
  source: official
  owner: AgentArena
  lifecycle: core
  difficulty: easy
  objective: Fix one small observable utility regression and keep the repository green.
  repoTypes: [node]
  tags: [core, benchmark, bugfix]
  dependencies: []
  judgeRationale: Behavior and the existing utility suite must both pass; source scope is enforced separately.
  differentiator: A small regression that rewards reading existing tests before editing.
  i18n:
    zh-CN:
      title: 修复单词首字母大写
      description: 修复一个字符串工具回归，同时不影响相邻功能。
      objective: 修复小型可观察行为问题并保持仓库测试通过。
      judgeRationale: 行为检查和现有工具测试必须同时通过，修改范围另行强制校验。
repoSource: builtin://nodejs-core
prompt: |
  Restore the intended behavior of `src/utils.js`.

  `capitalizeWords` should uppercase the first letter of every word while
  preserving the original whitespace and handling empty input. Keep the public
  exports and the behavior of `reverse`, `slugify`, and `truncate` unchanged.
  Work only in the implementation file; do not edit tests, setup scripts, or
  package metadata.
expectedChangedPaths: [src/utils.js]
changePolicy:
  requireAgentChange: true
  allowedPaths: [src/utils.js]
  forbiddenPaths: ["test/**", "scripts/**", package.json, "fixtures/**"]
  minChangedFiles: 1
  maxChangedFiles: 1
envAllowList: []
setupCommands:
  - id: inject-fault
    label: Prepare the isolated capitalization regression
    command: node scripts/inject-task-fault.mjs repo-health
    timeoutMs: 10000
judges:
  - id: behavior
    type: command
    label: Capitalization behavior is restored
    command: node scripts/verify-core-task.mjs repo-health
    timeoutMs: 10000
    critical: true
  - id: regression-tests
    type: command
    label: Existing utility tests pass
    command: node --test test/utils.test.js
    timeoutMs: 30000
    critical: true
