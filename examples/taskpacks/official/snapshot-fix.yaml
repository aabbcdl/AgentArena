schemaVersion: agentarena.taskpack/v1
id: snapshot-fix
title: Restore Deterministic Snapshot Output
description: Fix a generator so its stable text output matches the fixture contract.
metadata:
  source: official
  owner: AgentArena
  lifecycle: core
  difficulty: easy
  objective: Restore exact deterministic output without introducing time or environment dependencies.
  repoTypes: [node]
  tags: [core, benchmark, snapshot, deterministic]
  dependencies: []
  judgeRationale: The generator is executed directly and through its regression test with an exact output assertion.
  differentiator: Rewards precise output repair and avoids timing-sensitive snapshots.
  i18n:
    zh-CN:
      title: 恢复确定性快照输出
      description: 修复生成器，使稳定文本输出符合契约。
      objective: 恢复精确且不依赖时间或环境的输出。
      judgeRationale: 生成器会直接执行并通过回归测试进行精确断言。
repoSource: builtin://nodejs-core
prompt: |
  Restore the deterministic output contract for `src/generator.js`. Running
  `node scripts/generate.mjs` must produce the documented report heading and
  item count exactly, including line breaks. Keep the generator API and input
  validation intact; modify only the generator implementation.
expectedChangedPaths: [src/generator.js]
changePolicy:
  requireAgentChange: true
  allowedPaths: [src/generator.js]
  forbiddenPaths: ["test/**", "scripts/**", package.json, "fixtures/**"]
  minChangedFiles: 1
  maxChangedFiles: 1
envAllowList: []
setupCommands:
  - id: inject-fault
    label: Prepare the isolated generator regression
    command: node scripts/inject-task-fault.mjs snapshot-fix
    timeoutMs: 10000
judges:
  - id: behavior
    type: command
    label: Generator output matches exactly
    command: node scripts/verify-core-task.mjs snapshot-fix
    timeoutMs: 10000
    critical: true
  - id: regression-tests
    type: command
    label: Generator test passes
    command: node --test test/generator.test.js
    timeoutMs: 30000
    critical: true
