schemaVersion: agentarena.taskpack/v1
id: failing-test-fix
title: Fix the Failing Arithmetic Test
description: Correct one calculator operation while preserving the rest of the arithmetic API.
metadata:
  source: official
  owner: AgentArena
  lifecycle: core
  difficulty: easy
  objective: Diagnose a focused failing test and repair the implementation without unrelated changes.
  repoTypes: [node]
  tags: [core, benchmark, bugfix, tests]
  dependencies: []
  judgeRationale: Direct edge cases and the complete calculator suite guard against a partial or compensating fix.
  differentiator: A narrow fail-to-pass task with an explicit negative boundary for unrelated files.
  i18n:
    zh-CN:
      title: 修复失败的算术测试
      description: 修复一个计算器操作，同时保持其他算术 API 不变。
      objective: 定位单一失败测试并进行最小实现修复。
      judgeRationale: 直接边界检查和完整计算器测试会阻止局部或补偿式修复。
repoSource: builtin://nodejs-core
prompt: |
  Fix the implementation behind the failing subtraction behavior in
  `src/calculator.js`. Positive, negative, and zero results must be correct;
  addition, multiplication, division (including its zero-divisor error), and
  power must keep their current contracts. Do not edit tests or unrelated files.
expectedChangedPaths: [src/calculator.js]
changePolicy:
  requireAgentChange: true
  allowedPaths: [src/calculator.js]
  forbiddenPaths: ["test/**", "scripts/**", package.json, "fixtures/**"]
  minChangedFiles: 1
  maxChangedFiles: 1
envAllowList: []
setupCommands:
  - id: inject-fault
    label: Prepare the isolated arithmetic regression
    command: node scripts/inject-task-fault.mjs failing-test-fix
    timeoutMs: 10000
judges:
  - id: behavior
    type: command
    label: Subtraction and neighboring operations are correct
    command: node scripts/verify-core-task.mjs failing-test-fix
    timeoutMs: 10000
    critical: true
  - id: regression-tests
    type: command
    label: Calculator tests pass
    command: node --test test/calculator.test.js
    timeoutMs: 30000
    critical: true
