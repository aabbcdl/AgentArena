schemaVersion: agentarena.taskpack/v1
id: add-feature-with-tests
title: Add a Memoization Helper
description: Add a small reusable memoization feature and cover its observable contract.
metadata:
  source: official
  owner: AgentArena
  lifecycle: core
  difficulty: medium
  objective: Complete a narrowly scoped feature addition with caching semantics and focused tests.
  repoTypes: [node]
  tags: [core, benchmark, feature, tests]
  dependencies: []
  judgeRationale: The behavior verifier checks cache reuse and the task-specific test file proves the feature is exercised.
  differentiator: Requires implementation, public export, and tests without changing existing helpers.
  i18n:
    zh-CN:
      title: 添加记忆化工具
      description: 添加可复用的记忆化功能并覆盖可观察契约。
      objective: 完成带缓存语义和聚焦测试的小型功能。
      judgeRationale: 行为验证器检查缓存复用，任务测试文件证明功能确实被覆盖。
repoSource: builtin://nodejs-core
prompt: |
  Complete the memoization feature exposed by `src/index.js`.

  Implement `memoize(fn)` in `src/memoize.js`: repeated calls with the same
  primitive arguments should reuse the first result, while a different argument
  tuple should compute a new result. Preserve the existing module exports and
  add a focused `test/memoize.test.js` file. Do not edit the fixture scripts or
  unrelated modules.
expectedChangedPaths: [src/memoize.js, src/index.js, test/memoize.test.js]
changePolicy:
  requireAgentChange: true
  allowedPaths: [src/memoize.js, src/index.js, test/memoize.test.js]
  forbiddenPaths: ["scripts/**", package.json, "fixtures/**"]
  minChangedFiles: 2
  maxChangedFiles: 3
envAllowList: []
setupCommands:
  - id: inject-fault
    label: Prepare the isolated memoization stub
    command: node scripts/inject-task-fault.mjs add-feature-with-tests
    timeoutMs: 10000
judges:
  - id: behavior
    type: command
    label: Memoization behavior and export are correct
    command: node scripts/verify-core-task.mjs add-feature-with-tests
    timeoutMs: 10000
    critical: true
  - id: feature-tests
    type: command
    label: Feature tests pass
    command: node --test test/memoize.test.js
    timeoutMs: 30000
    critical: true
