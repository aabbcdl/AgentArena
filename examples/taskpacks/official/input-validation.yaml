schemaVersion: agentarena.taskpack/v1
id: input-validation
title: Restore Input Validation Boundaries
description: Block script injection and path traversal while preserving useful input errors.
metadata:
  source: official
  owner: AgentArena
  lifecycle: core
  difficulty: medium
  objective: Restore security-relevant validation behavior with deterministic local checks.
  repoTypes: [node]
  tags: [core, benchmark, validation, security]
  dependencies: []
  judgeRationale: Behavioral checks cover sanitization, traversal, and empty values; no source-pattern shortcut is accepted.
  differentiator: A practical boundary task with clear safe and unsafe examples.
  i18n:
    zh-CN:
      title: 恢复输入校验边界
      description: 阻止脚本注入和路径穿越，同时保留有用的输入错误。
      objective: 用确定性的本地检查恢复安全相关校验行为。
      judgeRationale: 行为检查覆盖清理、穿越和空值，不接受只改源码文字的捷径。
repoSource: builtin://nodejs-core
prompt: |
  Restore the validation behavior in `src/validator.js`.

  HTML input must return readable text without script or markup tags, paths must
  stay inside the supplied root (including traversal attempts), and empty names
  must be rejected by `requireNonEmptyString`. Keep the existing exports and
  modify only this implementation file.
expectedChangedPaths: [src/validator.js]
changePolicy:
  requireAgentChange: true
  allowedPaths: [src/validator.js]
  forbiddenPaths: ["test/**", "scripts/**", package.json, "fixtures/**"]
  minChangedFiles: 1
  maxChangedFiles: 1
envAllowList: []
setupCommands:
  - id: inject-fault
    label: Prepare the isolated validation regression
    command: node scripts/inject-task-fault.mjs input-validation
    timeoutMs: 10000
judges:
  - id: behavior
    type: command
    label: Input validation boundaries are enforced
    command: node scripts/verify-core-task.mjs input-validation
    timeoutMs: 10000
    critical: true
  - id: regression-tests
    type: command
    label: Existing validator behavior test passes
    command: node --test test/validator.behavior.test.js
    timeoutMs: 30000
    critical: true
