schemaVersion: agentarena.taskpack/v1
id: cross-file-refactor
title: Extract the Slugify Module
description: Move a shared string helper into its own module without changing callers.
metadata:
  source: official
  owner: AgentArena
  lifecycle: core
  difficulty: medium
  objective: Perform a behavior-preserving extraction and update the public import path.
  repoTypes: [node]
  tags: [core, benchmark, refactor, modules]
  dependencies: []
  judgeRationale: Runtime identity, public exports, and the existing utility suite verify the extraction end to end.
  differentiator: Requires a real module boundary rather than a no-op or duplicate implementation.
  i18n:
    zh-CN:
      title: 提取 slugify 模块
      description: 将共享字符串工具移到独立模块，同时保持调用方行为。
      objective: 完成不改变行为的模块提取并更新公共导出。
      judgeRationale: 运行时身份、公共导出和现有工具测试共同验证提取结果。
repoSource: builtin://nodejs-core
prompt: |
  Extract `slugify` into `src/slugify.js` and update the existing utility/public
  exports to use that single implementation. The helper must continue to turn
  punctuation and whitespace into a stable lowercase hyphenated slug. Do not
  leave a second function definition in `src/utils.js`, and do not edit tests or
  setup scripts except for the implementation files named below.
expectedChangedPaths: [src/slugify.js, src/utils.js, src/index.js]
changePolicy:
  requireAgentChange: true
  allowedPaths: [src/slugify.js, src/utils.js, src/index.js]
  forbiddenPaths: ["test/**", "scripts/**", package.json, "fixtures/**"]
  minChangedFiles: 1
  maxChangedFiles: 3
envAllowList: []
setupCommands:
  - id: inject-fault
    label: Prepare the isolated duplicated-helper state
    command: node scripts/inject-task-fault.mjs cross-file-refactor
    timeoutMs: 10000
judges:
  - id: behavior
    type: command
    label: Extracted module and public exports agree
    command: node scripts/verify-core-task.mjs cross-file-refactor
    timeoutMs: 10000
    critical: true
  - id: regression-tests
    type: command
    label: Utility tests pass after extraction
    command: node --test test/utils.test.js
    timeoutMs: 30000
    critical: true
