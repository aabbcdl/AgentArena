schemaVersion: agentarena.taskpack/v1
id: logging-improvement
title: Improve Structured Logging
description: Restore log levels, context propagation, and child logger behavior.
metadata:
  source: official
  owner: AgentArena
  lifecycle: core
  difficulty: medium
  objective: Make logging useful for routine filtering and request-scoped diagnostics.
  repoTypes: [node]
  tags: [core, benchmark, logging, behavior]
  dependencies: []
  judgeRationale: Direct output assertions and the existing logger behavior test verify filtering and context rather than source text.
  differentiator: Distinguishes a working structured logger from a superficial level-label change.
  i18n:
    zh-CN:
      title: 改进结构化日志
      description: 恢复日志级别、上下文传递和子 logger 行为。
      objective: 让日志具备日常过滤和请求级诊断能力。
      judgeRationale: 直接输出断言和现有日志行为测试验证实际行为，而不是只检查源码文字。
repoSource: builtin://nodejs-core
prompt: |
  Improve `src/logger.js` so it supports the existing public shape and useful
  structured output. A configured minimum level must suppress lower-priority
  messages, base context must be merged with per-call context, and `child()`
  must preserve the scope and inherited level while adding context. Keep the
  logger dependency-free and do not edit tests or setup scripts.
expectedChangedPaths: [src/logger.js]
changePolicy:
  requireAgentChange: true
  allowedPaths: [src/logger.js]
  forbiddenPaths: ["test/**", "scripts/**", package.json, "fixtures/**"]
  minChangedFiles: 1
  maxChangedFiles: 1
envAllowList: []
setupCommands:
  - id: inject-fault
    label: Prepare the isolated logger regression
    command: node scripts/inject-task-fault.mjs logging-improvement
    timeoutMs: 10000
judges:
  - id: behavior
    type: command
    label: Structured logger behavior is correct
    command: node scripts/verify-core-task.mjs logging-improvement
    timeoutMs: 10000
    critical: true
  - id: regression-tests
    type: command
    label: Existing logger behavior test passes
    command: node --test test/logger.behavior.test.js
    timeoutMs: 30000
    critical: true
