schemaVersion: agentarena.taskpack/v1
id: json-contract-repair
title: Repair a JSON Response Contract
description: Restore a deterministic response fixture to its documented shape.
metadata:
  source: official
  owner: AgentArena
  lifecycle: core
  difficulty: easy
  objective: Make a JSON response satisfy its required fields and value types.
  repoTypes: [node]
  tags: [core, benchmark, json, contract]
  dependencies: []
  judgeRationale: The contract module and a direct structural check must agree on the repaired fixture.
  differentiator: Separates exact data repair from source-code changes.
  i18n:
    zh-CN:
      title: 修复 JSON 响应契约
      description: 将确定性的响应数据恢复到文档规定的结构。
      objective: 让 JSON 响应满足必需字段和值类型。
      judgeRationale: 契约模块和直接结构检查必须同时认可修复后的数据。
repoSource: builtin://nodejs-core
prompt: |
  Repair `fixtures/response.json` to match the contract enforced by
  `src/json-contract.js`. It must represent a ready response with a non-empty
  request id, integer item values, and no extra top-level fields. Do not change
  the contract implementation or any tests.
expectedChangedPaths: [fixtures/response.json]
changePolicy:
  requireAgentChange: true
  allowedPaths: [fixtures/response.json]
  forbiddenPaths: ["test/**", "scripts/**", package.json, "src/**"]
  minChangedFiles: 1
  maxChangedFiles: 1
envAllowList: []
setupCommands:
  - id: inject-fault
    label: Prepare the isolated response regression
    command: node scripts/inject-task-fault.mjs json-contract-repair
    timeoutMs: 10000
judges:
  - id: behavior
    type: command
    label: Response matches the JSON contract
    command: node scripts/verify-core-task.mjs json-contract-repair
    timeoutMs: 10000
    critical: true
  - id: regression-tests
    type: command
    label: Contract tests pass
    command: node --test test/json-contract.test.js
    timeoutMs: 30000
    critical: true
