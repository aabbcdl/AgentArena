schemaVersion: agentarena.taskpack/v1
id: config-repair
title: Repair Typed Configuration
description: Correct a small JSON configuration while preserving unrelated values.
metadata:
  source: official
  owner: AgentArena
  lifecycle: core
  difficulty: easy
  objective: Restore the declared types and valid ranges in a configuration fixture.
  repoTypes: [node]
  tags: [core, benchmark, json, repair]
  dependencies: []
  judgeRationale: The verifier checks the complete contract and immutable neighboring fields.
  differentiator: Tests careful JSON editing rather than broad rewrites.
  i18n:
    zh-CN:
      title: 修复类型配置
      description: 修复一个 JSON 配置，同时保留无关字段。
      objective: 恢复配置声明的类型和值域。
      judgeRationale: 验证器检查完整契约以及不应改变的字段。
repoSource: builtin://nodejs-core
prompt: |
  Repair `fixtures/config.json` so it satisfies the repository's configuration
  contract. The server port must be a positive number, the database pool size
  must be a positive integer, and the existing mode, version, host, and database
  URL must remain unchanged. Keep the JSON valid and modify only this fixture.
expectedChangedPaths: [fixtures/config.json]
changePolicy:
  requireAgentChange: true
  allowedPaths: [fixtures/config.json]
  forbiddenPaths: ["test/**", "scripts/**", package.json, "src/**"]
  minChangedFiles: 1
  maxChangedFiles: 1
envAllowList: []
setupCommands:
  - id: inject-fault
    label: Prepare the isolated configuration regression
    command: node scripts/inject-task-fault.mjs config-repair
    timeoutMs: 10000
judges:
  - id: behavior
    type: command
    label: Configuration contract is valid
    command: node scripts/verify-core-task.mjs config-repair
    timeoutMs: 10000
    critical: true
  - id: repository-tests
    type: command
    label: Repository tests remain green
    command: node --test test/*.test.js
    timeoutMs: 30000
    critical: true
