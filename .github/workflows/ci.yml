name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Validate Prometheus rules
        run: docker run --rm -v "$PWD/monitoring:/rules:ro" --entrypoint /bin/promtool prom/prometheus:v3.5.0 check rules /rules/alerts.yaml

      - name: Build workspace
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Type check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

  web-report-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: playwright-chromium-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run web-report browser smoke test
        run: AGENTARENA_RUN_BROWSER_SMOKE=1 pnpm test:web-report:e2e

  smoke-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    needs:
      - test
      - web-report-browser-smoke

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Run smoke benchmark
        run: node packages/cli/dist/index.js run --repo . --task examples/taskpacks/demo-repo-health.json --agents demo-fast --output .agentarena/ci-smoke

      - name: Prepare smoke artifacts
        run: |
          set -euo pipefail
          run_dir="$(find .agentarena/ci-smoke -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
          if [ -z "$run_dir" ]; then
            echo "No smoke benchmark output directory found" >&2
            exit 1
          fi
          for file in badge.json summary.json summary.md pr-comment.md report.html; do
            test -f "$run_dir/$file"
            cp "$run_dir/$file" ".agentarena/ci-smoke/$file"
          done

      - name: Publish smoke summary
        run: cat .agentarena/ci-smoke/pr-comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment smoke summary on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const summaryPath = ".agentarena/ci-smoke/pr-comment.md";
            const marker = "<!-- agentarena-smoke-summary -->";
            const summary = fs.readFileSync(summaryPath, "utf8");
            const body = `${marker}\n${summary}`;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body
              });
            }

      - name: Upload smoke report
        uses: actions/upload-artifact@v4
        with:
          name: agentarena-smoke-report
          path: |
            .agentarena/ci-smoke/badge.json
            .agentarena/ci-smoke/summary.json
            .agentarena/ci-smoke/summary.md
            .agentarena/ci-smoke/pr-comment.md
            .agentarena/ci-smoke/report.html
